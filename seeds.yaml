# =============================================================
# seeds.yaml — 슬롯에 주입되는 한국 특화 엔티티 풀
# LLM은 이 값을 "그대로 포함"해서 문장만 만든다. (지식 주입은 여기서)
#
# - 일반 풀: 문자열 리스트
# - 합성 풀: {include: [풀이름, ...]} 형태로 다른 풀을 합쳐 정의
# - 스냅샷 기준일: 2026-07 (종목명·행정구역은 변동될 수 있으니 주기 갱신)
# =============================================================

date_ref:
  - 오늘
  - 내일
  - 모레
  - 이번 주말
  - 다음 주

# ---- 이벤트형(트렌드 전용) 풀 ----
# 기본값을 두지 않는다. ④ 트렌드 시드 탭에서 값이 등록되어 있는 동안에만
# 이 풀을 쓰는 인텐트(태풍 경로, 공모주 청약 등)가 활성화되고,
# 시드가 만료되면 해당 인텐트도 자동으로 생성 대상에서 빠진다.
typhoon_name: []     # 활동 중인 태풍 이름 (예: 바비) — 북상·영향 시기에 등록
ipo_stock: []        # 예: 청약 임박 공모주 종목명
hot_item: []         # 예: 두쫀쿠, 버터떡 같은 유행 품목

